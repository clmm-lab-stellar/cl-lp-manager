[package]
name = "sik-cl-lp-manager-demo-pool"
description = "TESTNET DEMO ONLY. Minimal Aquarius-concentrated-shaped pool stand-in for the cl-lp-manager vault demo. Not Aquarius, not a real AMM: positions keep their deposited amounts and the price is set by the admin. Never deploy to mainnet (gate G-VALUE)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
